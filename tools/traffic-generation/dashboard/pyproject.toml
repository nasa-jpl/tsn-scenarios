[project]
name = "trex-dashboard"
version = "0.1.0"
description = "Real-time T-Rex traffic generator dashboard with optional ProfiShark tap latency."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "pyshark>=0.6",
]

[project.scripts]
trex-dashboard = "trex_dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trex_dashboard"]
